<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S-01 ログイン / サインアップ（ワイヤーフレーム）</title>
</head>
<body style="margin:0;font-family:sans-serif;background:#f0f0f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;">
  <div style="width:100%;max-width:400px;background:#fff;border:1px solid #ccc;border-radius:8px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
    <p style="margin:0 0 8px 0;font-size:12px;color:#888;">画面ID: S-01</p>
    <h1 style="margin:0 0 24px 0;font-size:20px;font-weight:600;color:#333;">ログイン / サインアップ</h1>

    <!-- 認証フォーム AuthForm -->
    <div style="margin-bottom:16px;">
      <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">メールアドレス</label>
      <input type="text" placeholder="example@email.com" readonly style="width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:4px;font-size:14px;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:20px;">
      <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">パスワード</label>
      <input type="password" placeholder="••••••••" readonly style="width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:4px;font-size:14px;box-sizing:border-box;">
    </div>
    <p style="margin:0 0 16px 0;font-size:11px;color:#c00;">※ エラー表示領域（バリデーション時）</p>

    <button style="width:100%;padding:12px;background:#333;color:#fff;border:none;border-radius:4px;font-size:14px;font-weight:500;margin-bottom:12px;">ログイン</button>
    <button style="width:100%;padding:12px;background:#fff;color:#333;border:1px solid #ccc;border-radius:4px;font-size:14px;margin-bottom:20px;">サインアップ</button>

    <div style="text-align:center;margin-bottom:16px;">
      <span style="font-size:12px;color:#999;">— または —</span>
    </div>
    <button style="width:100%;padding:12px;background:#fff;border:1px solid #ccc;border-radius:4px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
      <span style="width:20px;height:20px;border:1px solid #ddd;border-radius:4px;display:inline-block;"></span>
      Googleでログイン
    </button>
  </div>
</body>
</html>
