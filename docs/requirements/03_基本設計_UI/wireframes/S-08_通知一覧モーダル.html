<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S-08 通知一覧モーダル（ワイヤーフレーム）</title>
</head>
<body style="margin:0;font-family:sans-serif;background:#f0f0f0;min-height:100vh;box-sizing:border-box;">
  <div style="width:100%;max-width:400px;margin:0 auto;min-height:100vh;position:relative;">
    <!-- 背景（呼び出し元：ダッシュボード等） -->
    <div style="padding:16px;background:#e8e8e8;">
      <p style="margin:0;font-size:12px;color:#999;">ヘッダー通知アイコンから表示 → オーバーレイでモーダル</p>
    </div>

    <!-- オーバーレイ -->
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-start;justify-content:center;padding:24px;box-sizing:border-box;">
      <!-- 通知一覧モーダル NotificationListModal -->
      <div style="width:100%;max-width:360px;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.15);overflow:hidden;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #eee;">
          <h2 style="margin:0;font-size:16px;font-weight:600;">通知一覧</h2>
          <button style="padding:4px 8px;border:1px solid #ccc;border-radius:4px;font-size:12px;">閉じる</button>
        </div>
        <div style="max-height:320px;overflow-y:auto;">
          <div style="padding:14px 16px;border-bottom:1px solid #eee;background:#f9f9f9;">
            <p style="margin:0 0 4px 0;font-size:13px;font-weight:500;">〇〇ゴールに投票がありました</p>
            <p style="margin:0;font-size:11px;color:#888;">未読　10分前</p>
          </div>
          <div style="padding:14px 16px;border-bottom:1px solid #eee;">
            <p style="margin:0 0 4px 0;font-size:13px;">△△さんがゴールを完了しました</p>
            <p style="margin:0;font-size:11px;color:#888;">既読　1時間前</p>
          </div>
          <div style="padding:14px 16px;">
            <p style="margin:0 0 4px 0;font-size:13px;">チームに招待されました</p>
            <p style="margin:0;font-size:11px;color:#888;">既読　昨日</p>
          </div>
        </div>
        <p style="margin:0;padding:12px 16px;font-size:11px;color:#888;border-top:1px solid #eee;">画面ID: S-08　通知クリック→ゴール詳細へ　閉じる→元画面に留まる</p>
      </div>
    </div>
  </div>
</body>
</html>
