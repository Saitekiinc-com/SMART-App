<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S-02 招待受諾画面（ワイヤーフレーム）</title>
</head>
<body style="margin:0;font-family:sans-serif;background:#f0f0f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;">
  <div style="width:100%;max-width:400px;background:#fff;border:1px solid #ccc;border-radius:8px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
    <p style="margin:0 0 8px 0;font-size:12px;color:#888;">画面ID: S-02</p>
    <h1 style="margin:0 0 24px 0;font-size:20px;font-weight:600;color:#333;">招待受諾画面</h1>

    <!-- 招待受諾カード InviteAcceptCard -->
    <div style="border:1px solid #ddd;border-radius:8px;padding:20px;margin-bottom:24px;background:#fafafa;">
      <p style="margin:0 0 8px 0;font-size:12px;color:#666;">チーム名</p>
      <p style="margin:0 0 16px 0;font-size:18px;font-weight:600;color:#333;">〇〇チーム</p>
      <p style="margin:0 0 8px 0;font-size:12px;color:#666;">招待者</p>
      <p style="margin:0 0 20px 0;font-size:14px;color:#333;">山田 太郎 さんから招待されています</p>
      <button style="width:100%;padding:12px;background:#333;color:#fff;border:none;border-radius:4px;font-size:14px;font-weight:500;">参加する</button>
    </div>

    <p style="margin:0;font-size:12px;color:#888;text-align:center;">未ログインの場合は「サインアップ／ログインへ」リンクで S-01 へ誘導</p>
  </div>
</body>
</html>
