<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S-06 ゴール詳細（ワイヤーフレーム）</title>
</head>
<body style="margin:0;font-family:sans-serif;background:#f0f0f0;min-height:100vh;box-sizing:border-box;">
  <div style="width:100%;max-width:400px;margin:0 auto;min-height:100vh;background:#fff;border:1px solid #ccc;box-shadow:0 0 12px rgba(0,0,0,0.06);">
    <!-- アプリヘッダー AppHeader -->
    <header style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee;">
      <span style="font-size:14px;">← 戻る</span>
      <div style="display:flex;gap:12px;">
        <span style="width:24px;height:24px;border:1px solid #ccc;border-radius:4px;"></span>
        <span style="width:24px;height:24px;border:1px solid #ccc;border-radius:50%;"></span>
      </div>
    </header>

    <main style="padding:16px;">
      <p style="margin:0 0 8px 0;font-size:12px;color:#888;">画面ID: S-06</p>

      <!-- ゴール詳細パネル GoalDetailPanel -->
      <div style="margin-bottom:20px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
          <h1 style="margin:0;font-size:18px;font-weight:600;">ゴールタイトル</h1>
          <span style="font-size:11px;padding:4px 8px;background:#e8f5e9;color:#2e7d32;border-radius:4px;">進行中</span>
        </div>
        <div style="font-size:13px;color:#666;margin-bottom:16px;">
          <p style="margin:0 0 4px 0;">Specific: 〇〇〇</p>
          <p style="margin:0 0 4px 0;">Measurable: 〇〇〇</p>
          <p style="margin:0 0 4px 0;">Achievable / Relevant / Time-bound: 〇〇</p>
        </div>

        <!-- 投票UI VoteUI -->
        <div style="background:#f5f5f5;border-radius:8px;padding:12px;margin-bottom:16px;border:1px solid #eee;">
          <p style="margin:0 0 8px 0;font-size:12px;color:#666;">投票</p>
          <button style="padding:8px 16px;border:1px solid #333;border-radius:4px;font-size:13px;">投票する</button>
          <span style="margin-left:12px;font-size:13px;">2票</span>
        </div>

        <!-- アプローチチェックリスト -->
        <div style="margin-bottom:16px;">
          <p style="margin:0 0 8px 0;font-size:12px;color:#666;">アプローチチェックリスト　進捗 2/5 (40%)</p>
          <ul style="margin:0;padding:0;list-style:none;">
            <li style="padding:8px 0;border-bottom:1px solid #eee;font-size:13px;">☑ アプローチ1</li>
            <li style="padding:8px 0;border-bottom:1px solid #eee;font-size:13px;">☑ アプローチ2</li>
            <li style="padding:8px 0;border-bottom:1px solid #eee;font-size:13px;">☐ アプローチ3</li>
            <li style="padding:8px 0;border-bottom:1px solid #eee;font-size:13px;">☐ アプローチ4</li>
            <li style="padding:8px 0;font-size:13px;">☐ アプローチ5</li>
          </ul>
        </div>

        <!-- ステータス変更 -->
        <p style="margin:0 0 8px 0;font-size:12px;color:#666;">ステータス変更</p>
        <div style="margin-bottom:16px;">
          <span style="padding:6px 12px;border:1px solid #333;border-radius:4px;font-size:12px;margin-right:8px;">未着手</span>
          <span style="padding:6px 12px;background:#333;color:#fff;border-radius:4px;font-size:12px;margin-right:8px;">進行中</span>
          <span style="padding:6px 12px;border:1px solid #ccc;border-radius:4px;font-size:12px;">完了</span>
        </div>

        <!-- 編集・削除（権限時） -->
        <div style="display:flex;gap:12px;">
          <button style="padding:8px 16px;border:1px solid #333;border-radius:4px;font-size:13px;">編集</button>
          <button style="padding:8px 16px;border:1px solid #c00;color:#c00;border-radius:4px;font-size:13px;background:#fff;">削除</button>
        </div>
        <p style="margin:8px 0 0 0;font-size:11px;color:#888;">※ 編集・削除は作成者またはリーダーのみ表示</p>
      </div>
    </main>
  </div>
</body>
</html>
