<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S-03 チーム選択（ワイヤーフレーム）</title>
</head>
<body style="margin:0;font-family:sans-serif;background:#f0f0f0;min-height:100vh;padding:16px;box-sizing:border-box;">
  <div style="width:100%;max-width:400px;margin:0 auto;background:#fff;border:1px solid #ccc;border-radius:8px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
    <p style="margin:0 0 8px 0;font-size:12px;color:#888;">画面ID: S-03</p>
    <h1 style="margin:0 0 24px 0;font-size:20px;font-weight:600;color:#333;">チーム選択</h1>

    <!-- チーム選択リスト TeamSelectList -->
    <p style="margin:0 0 12px 0;font-size:12px;color:#666;">所属チームから1つ選択 → そのチームのダッシュボードへ</p>
    <ul style="margin:0;padding:0;list-style:none;">
      <li style="border:1px solid #ccc;border-radius:6px;padding:16px;margin-bottom:8px;cursor:pointer;background:#f9f9f9;">
        <span style="font-size:16px;font-weight:500;">チームA</span>
        <span style="font-size:12px;color:#666;display:block;margin-top:4px;">リーダー</span>
      </li>
      <li style="border:1px solid #333;border-radius:6px;padding:16px;margin-bottom:8px;cursor:pointer;background:#fff;">
        <span style="font-size:16px;font-weight:500;">チームB</span>
        <span style="font-size:12px;color:#666;display:block;margin-top:4px;">メンバー</span>
      </li>
    </ul>
    <p style="margin:16px 0 0 0;font-size:11px;color:#888;">※ 所属1チームの場合は本画面スキップでダッシュボードへ</p>
  </div>
</body>
</html>
